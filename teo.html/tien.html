<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Lời Tỏ Tình 💖</title>
<style>
  body {
    background-color: pink;
    font-family: "Comic Sans MS", cursive, sans-serif;
    color: red;
    text-align: center;
    padding: 40px;
    position: relative;
    height: 100vh;
    overflow: hidden;
  }
  h1 {
    font-weight: bold;
    margin-bottom: 40px;
  }
  button {
    font-size: 16px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    position: absolute;
  }
  #yes_btn {
    background-color: lightgreen;
    color: black;
    left: 80px;
    top: 200px;
    width: 150px;
  }
  #no_btn {
    background-color: lightgray;
    color: black;
    left: 250px;
    top: 200px;
    width: 150px;
    transition: left 0.3s ease, top 0.3s ease;
  }
  #love_btn {
    position: static;
    margin-top: 280px;
    background-color: #ffb6c1;
    color: #a82c56;
    border-radius: 12px;
    padding: 10px 15px;
    cursor: pointer;
    position: relative;
    top: 300px;
  }
</style>
</head>
<body>

<h1>💘 CẬU LÀ MỌI ĐIỀU ĐẸP NHẤT TỚ GẶP 💘<br>Làm người yêu tớ nhé?</h1>

<button id="yes_btn">Dạaaaa 💖</button>
<button id="no_btn">Khônggg 😝</button>
<br />
<button id="love_btn">💌 Nói lời yêu 💌</button>

<script>
  const noBtn = document.getElementById('no_btn');
  const yesBtn = document.getElementById('yes_btn');
  const loveBtn = document.getElementById('love_btn');

  noBtn.addEventListener('mouseenter', () => {
    // Giới hạn vị trí trong cửa sổ trình duyệt
    const x = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth));
    const y = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight));
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });

  yesBtn.addEventListener('click', () => {
    alert("Tớ biết mà 🥰! Mình chính thức là một cặp nhé 💑💖");
  });

  loveBtn.addEventListener('click', () => {
    alert("Tớ thích cậu lâu rồi, làm người yêu tớ nhé? 💘");
  });
</script>

</body>
</html>
